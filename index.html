<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf6ee;--card:#fff;--tx:#25302a;--mu:#6b7a70;--red:#b3262e;--grn:#1f6b45;--bd:#e4dccd}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16201b;--card:#1f2c25;--tx:#f1ece0;--mu:#9fb0a5;--red:#e0545c;--grn:#4cb583;--bd:#33463b}}
:root[data-theme="dark"]{--bg:#16201b;--card:#1f2c25;--tx:#f1ece0;--mu:#9fb0a5;--red:#e0545c;--grn:#4cb583;--bd:#33463b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:20px 0 8px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:4px 0}
button{padding:11px 14px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:600;cursor:pointer}
button.g{background:var(--grn)}button.s{background:transparent;color:var(--red);border:1px solid var(--red)}
button:disabled{opacity:.5}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--card);color:var(--tx);border:2px solid var(--bd)}
.opt.sel{border-color:var(--red)}.opt.ok{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 18%,var(--card))}.opt.ko{border-color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.timer{font-size:34px;font-weight:700;text-align:center;color:var(--red)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--red);color:#fff}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.snow i{position:absolute;top:-24px;font-style:normal;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.snow{display:none}}
body{background:radial-gradient(900px 360px at 50% -120px,color-mix(in srgb,var(--red) 16%,transparent),transparent),var(--bg)}
main{position:relative;z-index:1}h1{text-align:center}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:12px 0}
.pod>div{flex:1;text-align:center;border-radius:12px 12px 0 0;padding:10px 4px;background:var(--card);border:1px solid var(--bd)}
.pod .p1{min-height:150px;border-color:#d4a017}.pod .p2{min-height:115px}.pod .p3{min-height:90px}
.pod b{display:block;overflow-wrap:anywhere}
main.wide{max-width:1200px}.proj h1{display:none}.proj h2{font-size:clamp(26px,5vw,60px)}
.proj .opt{font-size:clamp(18px,3vw,36px);padding:16px}.proj .timer{font-size:clamp(40px,8vw,110px)}
.proj table{font-size:clamp(16px,2.4vw,30px)}.proj .card{font-size:clamp(16px,2.4vw,28px)}
</style></head><body><div class="snow" id="snow"></div><main>
<h1>❓ Quiz</h1>
<div id="app" class="mu">Caricamento…</div>
</main>
<script type="module">
import {firebaseConfig} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,doc as fDoc,collection as fCol,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot as fSnap,query,orderBy as fOrd,addDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
(async()=>{
const $=s=>document.querySelector(s), app=$('#app');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let uid=null,isAdmin=false,dl=null,proj=false,editId=null;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let fdb,auth;
try{if(String(firebaseConfig.apiKey).startsWith('INCOLLA'))throw 0;const fa=initializeApp(firebaseConfig);fdb=getFirestore(fa);auth=getAuth(fa);await signInAnonymously(auth);uid=auth.currentUser.uid}
catch(e){app.innerHTML='<div class="card">Configurazione Firebase mancante o non valida. Controlla firebase-config.js e che il login anonimo sia attivo.</div>';return}
const rd=s=>({data:()=>s.exists()?s.data():undefined});
const mkDoc=p=>({get:async()=>rd(await getDoc(fDoc(fdb,p))),set:d=>setDoc(fDoc(fdb,p),d),update:d=>updateDoc(fDoc(fdb,p),d),delete:()=>deleteDoc(fDoc(fdb,p)),onSnapshot:(n,e)=>fSnap(fDoc(fdb,p),s=>n(rd(s)),e)});
const mkCol=(p,ob)=>({orderBy:f=>mkCol(p,f),add:async d=>({id:(await addDoc(fCol(fdb,p),d)).id}),onSnapshot:(n,e)=>fSnap(ob?query(fCol(fdb,p),fOrd(ob)):fCol(fdb,p),s=>n({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e)});
const db={doc:mkDoc,collection:p=>mkCol(p)};
dl=true;
isAdmin=ls.get('qadm')==='1';
if(isAdmin){try{const sn=await getDoc(fDoc(fdb,'admins/'+uid));if(!sn.exists())throw 0}catch(e){isAdmin=false;ls.set('qadm',null)}}
const P=s=>s.docs?s.docs.map(d=>({id:d.id,...d.data()})):[];
let ft='mc',endedKey='',loaded=false,mode='singolo',nick='',err='',tab='live',sel=null,now=Date.now(),rooms=[],qs=[],players=[],me=null,claimed=false,first=true;
const key=n=>n.toLowerCase().replace(/[^a-z0-9]/g,'')||'x';
const meRef=db.doc('players/'+uid);
const S=()=>rooms.find(r=>r.id===(isAdmin?sel:(me&&me.room)));
const THEMES={
 neutro:{n:'Neutro',e:'❓',t:'Quiz',p:'#2f5d8a',a:'#1f8a70',pd:'#6fa8dc',ad:'#4cb59a',bg:'#f4f6f8',bgd:'#151b22',pt:'',end:'🏆 Complimenti!'},
 natale:{n:'Natale',e:'🎄',t:'Quizzone Natalizio',p:'#b3262e',a:'#1f6b45',pd:'#e0545c',ad:'#4cb583',bg:'#fbf6ee',bgd:'#16201b',pt:'❄',end:'🎄 Buon Natale! 🎁'},
 pasqua:{n:'Pasqua',e:'🐣',t:'Quiz di Pasqua',p:'#8e5bb5',a:'#3f9b5a',pd:'#c39bea',ad:'#6fcf8a',bg:'#fbf8ee',bgd:'#1d1b24',pt:'🌸',end:'🐣 Buona Pasqua! 🥚'},
 halloween:{n:'Halloween',e:'🎃',t:'Halloween Quiz',p:'#d9650d',a:'#6a4c93',pd:'#ff9a3c',ad:'#b08ee0',bg:'#fbf3ea',bgd:'#17131c',pt:'🦇',end:'🎃 Buon Halloween! 👻'},
 carnevale:{n:'Carnevale',e:'🎭',t:'Quiz di Carnevale',p:'#d6336c',a:'#1c7ed6',pd:'#f783ac',ad:'#74c0fc',bg:'#fcf3f7',bgd:'#1a1620',pt:'🎊',end:'🎭 Buon Carnevale! 🎉'},
 estate:{n:'Estate',e:'☀️',t:"Quiz dell'Estate",p:'#e8890c',a:'#0b8ea6',pd:'#ffb347',ad:'#4fd1e0',bg:'#fffaf0',bgd:'#14201f',pt:'☀️',end:'☀️ Buona estate! 🍦'},
 compleanno:{n:'Compleanno',e:'🎂',t:'Quiz di Compleanno',p:'#e0457b',a:'#7048e8',pd:'#ff85b0',ad:'#a58bff',bg:'#fff5f8',bgd:'#1b1620',pt:'🎈',end:'🎂 Buon compleanno! 🎈'},
 capodanno:{n:'Capodanno',e:'🎆',t:'Quiz di Capodanno',p:'#b8860b',a:'#3b5bdb',pd:'#f0c64a',ad:'#8ea2ff',bg:'#f8f6ee',bgd:'#13151f',pt:'✨',end:'🎆 Buon anno! 🥂'}
};
let th=null;
const TH=()=>{const id=(th&&THEMES[th.id])?th.id:'neutro';return {id,...THEMES[id],title:(th&&th.title)||THEMES[id].t}};
function applyTheme(){const T=TH();let st=document.getElementById('th');if(!st){st=document.createElement('style');st.id='th';document.head.appendChild(st)}
 st.textContent=`:root{--red:${T.p};--grn:${T.a};--bg:${T.bg}}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:${T.pd};--grn:${T.ad};--bg:${T.bgd}}}:root[data-theme="dark"]{--red:${T.pd};--grn:${T.ad};--bg:${T.bgd}}`;
 document.title=T.title;const h=document.querySelector('h1');if(h)h.textContent=T.e+' '+T.title;
 const sn=document.getElementById('snow');if(sn){sn.innerHTML='';if(T.pt)for(let i=0;i<14;i++){const e=document.createElement('i');e.textContent=T.pt;e.style.cssText=`left:${Math.random()*100}%;font-size:${10+Math.random()*14}px;animation-duration:${9+Math.random()*12}s;animation-delay:-${Math.random()*15}s`;sn.appendChild(e)}}}
db.doc('settings/theme').onSnapshot(s=>{th=(s.data&&s.data())||null;applyTheme();render()},()=>{});
db.collection('rooms').orderBy('createdAt').onSnapshot(s=>{rooms=P(s);render()},()=>{});
db.collection('questions').orderBy('order').onSnapshot(s=>{qs=P(s);render()},()=>{});
db.collection('players').onSnapshot(s=>{players=P(s);me=players.find(p=>p.id===uid)||null;loaded=true;
 if(first){first=false;if(me&&!isAdmin)claim(me.name).then(ok=>{claimed=ok;if(!ok){err='Il nome "'+me.name+'" è già usato da un altro giocatore connesso.';meRef.delete().catch(()=>{})}render()});}
 render()},()=>{});
setInterval(()=>{now=Date.now();const R=S();if(R&&R.phase==='question')tick()},500);
setInterval(()=>{if(me&&claimed&&!isAdmin)db.doc('names/'+key(me.name)).set({uid,seen:Date.now(),name:me.name}).catch(()=>{})},15000);
document.addEventListener('focusout',()=>setTimeout(render,500));

async function claim(n){const r=db.doc('names/'+key(n));let d=null;try{const s=await r.get();d=s.data&&s.data()}catch(e){}
 if(d&&d.uid!==uid&&Date.now()-d.seen<45000)return false;
 try{await r.set({uid,seen:Date.now(),name:n})}catch(e){}return true}
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const canon=t=>String(t||'').replace(/\s*[–—\/]\s*|\s+-\s+/g,'|').split('|').map(norm).filter(Boolean).sort().join('|');
const matchQ=(x,t)=>!!norm(t)&&(x.answers||[]).some(v=>canon(v)===canon(t)||norm(v)===norm(t));
const okOf=(q,a)=>(q.type==='open'||q.type==='clues')?matchQ(q,a.c):a.c===q.correct;
const qLimit=x=>x.type==='clues'?x.clues.length*(x.clueSecs||15):(x.limit||20);
function ptsOf(q,a){if(q.type==='clues'){const n=q.clues.length;return Math.round((q.pts||n)*(n-Math.min(a.k||0,n-1))/n)}
if(q.sp===false)return q.pts||1000;
 const lim=qLimit(q)*1000;return Math.round((q.pts||1000)*(1-0.5*Math.min(a.ms,lim)/lim))}
function clueHtml(R,x,rev){const n=x.clues.length,cs=x.clueSecs||15,el=Math.max(0,now-R.startedAt)/1000,k=Math.min(n-1,Math.floor(el/cs)),sh=rev?n:k+1;
 let h=x.clues.slice(0,sh).map((c,i)=>`<div style="margin:6px 0;padding:10px;border:1px solid var(--bd);border-radius:10px">🔎 <b>Indizio ${i+1}:</b> ${esc(c)}</div>`).join('');
 if(!rev)h+=`<div class="mu">Valgono ora <b>${Math.round((x.pts||n)*(n-k)/n)}</b> punti${k<n-1?` · prossimo indizio tra ${Math.ceil(cs*(k+1)-el)}s`:' · ultimo indizio'}</div>`;
 return h}
function score(p){let pts=0,ms=0,ok=0;qs.forEach(q=>{const a=p.answers&&p.answers[q.id];if(!a)return;if(okOf(q,a)){pts+=ptsOf(q,a);ms+=a.ms;ok++}else pts-=(q.neg||0)});return{pts,ms,ok}}
const rank=list=>list.map(p=>({id:p.id,name:p.name+(p.mode==='gruppo'?' 👥':''),...score(p)})).sort((a,b)=>b.pts-a.pts||a.ms-b.ms);
function podiumHtml(list){const b=rank(list);if(!b.length)return '';const m=['🥇','🥈','🥉'],c=(i,k)=>b[i]?`<div class="${k}"><div style="font-size:28px">${m[i]}</div><b>${esc(b[i].name)}</b><span class="mu">${b[i].pts} pt</span></div>`:'';
 return `<div class="card" style="text-align:center"><h2 style="margin-top:0">${esc(TH().end)}</h2><div class="mu">Complimenti a ${esc(b[0].name)} e a tutti i partecipanti!</div><div class="pod">${c(1,'p2')}${c(0,'p1')}${c(2,'p3')}</div></div>`}
function csv(R){const rs=R?[R]:rooms,rows=[['Stanza','Posizione','Nome','Punti','Giuste','Tempo totale (s)'],...rs.flatMap(rm=>rank(players.filter(p=>p.room===rm.id)).map((x,i)=>[rm.name,i+1,x.name,x.pts,x.ok,(x.ms/1000).toFixed(1)]))];
 return '\ufeff'+rows.map(z=>z.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n')}
async function saveCsv(R){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv(R)],{type:'text/csv;charset=utf-8'}));a.download='quiz-'+(R?R.name:'tutte-le-stanze').replace(/[^\w-]+/g,'_')+'.csv';document.body.appendChild(a);a.click();a.remove()}
function boardHtml(list,R){const tot=R?roomQs(R).length:qs.length;const b=rank(list);
 if(!b.length)return '<p class="mu">Nessun partecipante.</p>';
 return '<div class="wrap"><table><tr><th>#</th><th>Nome</th><th>Punti</th><th>Giuste</th><th>Tempo tot.</th></tr>'+b.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.pts}</td><td>${r.ok}/${tot}</td><td>${(r.ms/1000).toFixed(1)}s</td></tr>`).join('')+'</table></div>'}
const left=(R,x)=>Math.max(0,(x?qLimit(x):20)-(now-R.startedAt)/1000);
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function inSpec(sp,n){sp=String(sp||'all').toLowerCase().trim();if(sp==='all'||sp==='')return true;if(!n)return false;return sp.split(',').some(t=>{const m=t.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);return m&&n>=+m[1]&&n<=+(m[2]||m[1])})}
function normSpec(t){t=String(t||'').toLowerCase().trim();if(!t||/^(tutt[eio]|all)$/.test(t))return 'all';return /^\d+(\s*-\s*\d+)?(\s*,\s*\d+(\s*-\s*\d+)?)*$/.test(t)?t.replace(/\s+/g,''):null}
const BAD='Stanze non valide: scrivi "tutte" oppure numeri come 1,3-4';
function roomQs(R){return qs.filter(q=>q.rs!=null?inSpec(q.rs,R.num):(q.room?q.room===R.id:true))}
function qFor(R,p){const l=roomQs(R);if(R.ord!=='random'||!p)return l;const g=rng(hash(p.id+R.id)),a=l.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(g()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const curQ=(R,p)=>qFor(R,p)[R.idx];
function tick(){const R=S();if(!R||R.phase!=='question')return;const x=isAdmin?((tab==='g'||proj||R.ord!=='random')?curQ(R):null):curQ(R,me);if(!x)return;
 const l=left(R,x),t=$('#tm');if(t)t.textContent=Math.ceil(l)+'s';
 const c=$('#cl');if(c)c.innerHTML=clueHtml(R,x,false);
 const k=R.id+'|'+R.idx+'|'+R.startedAt;if(l<=0&&(!isAdmin||tab==='g'||proj)&&endedKey!==k){endedKey=k;render(true)}}
function cfg(R,ph){const o=R.ord==='random'?'random':'same';
 if(ph!=='lobby')return `<div class="mu">Ordine: ${o==='random'?'casuale per ogni utente':'uguale per tutti'}</div>`;
 return `<select id="od"><option value="same" ${o==='same'?'selected':''}>Stesso ordine per tutti</option><option value="random" ${o==='random'?'selected':''}>Ordine casuale per ogni utente</option></select>`}
const PH={lobby:'In attesa',question:'In corso',reveal:'In corso',end:'Terminata'};

async function answer(c){const R=S(),x=R&&curQ(R,me);if(!x||R.phase!=='question'||(me.answers&&me.answers[x.id]))return;
 const ms=Math.max(0,Date.now()-R.startedAt);if(ms>((x.limit||20)*1000+1500))return;
 const answers={...(me.answers||{}),[x.id]:{c,ms}};me={...me,answers};
 try{await meRef.update({answers})}catch(e){alert('Risposta non registrata.')}render()}
async function sendText(){const R=S(),x=R&&curQ(R,me),el=$('#ans');if(!x||!el||R.phase!=='question')return;const t=el.value.trim();if(!t)return;
 const prev=me.answers&&me.answers[x.id];if(prev&&matchQ(x,prev.c))return;
 const ms=Math.max(0,Date.now()-R.startedAt);if(ms>qLimit(x)*1000+1500)return;
 const k=x.type==='clues'?Math.min(x.clues.length-1,Math.floor(ms/((x.clueSecs||15)*1000))):0;
 const answers={...(me.answers||{}),[x.id]:{c:t,ms,k}};me={...me,answers};
 try{await meRef.update({answers})}catch(e){alert('Risposta non registrata.')}render(true)}
async function register(){const n=$('#nm').value.trim();if(!n)return;
 if(mode==='singolo'&&/^\d{4,12}$/.test(n)){try{await setDoc(fDoc(fdb,'admins/'+uid),{pin:n});isAdmin=true;ls.set('qadm','1');nick='';err='';render();return}catch(e){}}
 if(!(await claim(n))){err='Nome già in uso da un giocatore connesso. Scegline un altro.';nick=n;render();return}
 err='';claimed=true;try{await meRef.set({name:n,mode,room:null,answers:{}})}catch(e){err='Impossibile registrarti: serve accesso Contributor.';render()}}
async function leave(){if(me)await db.doc('names/'+key(me.name)).delete().catch(()=>{});await meRef.delete().catch(()=>{});claimed=false;nick='';render()}

function startView(){return `<div class="card"><b>Come vuoi giocare?</b><div class="tabs"><button data-m="singolo" class="${mode==='singolo'?'on':''}">👤 Singolo</button><button data-m="gruppo" class="${mode==='gruppo'?'on':''}">👥 Gruppo</button></div><input id="nm" maxlength="24" value="${esc(nick)}" placeholder="${mode==='singolo'?'Il tuo nick':'Nome della squadra'}">${err?`<p style="color:var(--red)">${esc(err)}</p>`:''}<button id="go" style="width:100%;margin-top:6px">Continua</button></div>`}
function pickView(){return `<div class="card row" style="align-items:center"><div><b>${esc(me.name)}</b>${me.mode==='gruppo'?' 👥':''}<div class="mu">Scegli la stanza di gioco</div></div><button class="s" id="lv" style="flex:0 0 auto">Esci</button></div>`+
 (rooms.length?rooms.map(r=>`<div class="card"><b>${esc(r.name)}</b><div class="mu">${PH[r.phase]||''} · ${players.filter(p=>p.room===r.id).length} partecipanti</div><button data-r="${r.id}" ${r.phase==='end'?'disabled':''} style="width:100%;margin-top:8px">Entra</button></div>`).join(''):'<div class="card mu">Nessuna stanza disponibile: aspetta che l\'host ne crei una.</div>')}
function playerView(R){
 const ph=R.phase,x=curQ(R,me),list=players.filter(p=>p.room===R.id);
 let h=`<div class="card row" style="align-items:center"><div><b>${esc(me.name)}</b>${me.mode==='gruppo'?' 👥':''}<div class="mu">Stanza: ${esc(R.name)}</div></div><button class="s" id="cr" style="flex:0 0 auto">Cambia stanza</button></div>`;
 if(ph==='lobby')return h+'<div class="card">Aspetta che l\'host avvii la prima domanda…</div><div class="card"><b>In stanza</b>'+list.map(p=>'<div>'+esc(p.name)+'</div>').join('')+'</div>';
 if(ph==='end')return h+podiumHtml(list)+'<div class="card"><b>Classifica finale</b>'+boardHtml(list,R)+'</div>';
 if(!x)return h;
 const a=me.answers&&me.answers[x.id],rev=ph==='reveal'||left(R,x)<=0;
 h+=`<div class="card"><div class="mu">Domanda ${R.idx+1} di ${qFor(R,me).length}</div><h2 style="margin-top:4px">${esc(x.text)}</h2>`;
 if(!rev)h+=`<div class="timer" id="tm">${Math.ceil(left(R,x))}s</div>`;
 if(!x.type||x.type==='mc'){
  x.options.forEach((o,i)=>{const cls=rev?(i===x.correct?'ok':(a&&a.c===i?'ko':'')):(a&&a.c===i?'sel':'');
   h+=`<button class="opt ${cls}" data-c="${i}" ${(a||rev)?'disabled':''}>${esc(o)}</button>`});

  if(nx>=roomQs(R).length)return setRoom({phase:'end'});setRoom({phase:'question',idx:nx,startedAt:Date.now()})});
 on('#rv',()=>setRoom({phase:'reveal'}));
 on('#en',()=>setRoom({phase:'end'}));
 on('#rs',async()=>{if(!confirm('Azzerare punteggi e ripartire da capo in questa stanza?'))return;
  for(const p of players.filter(p=>p.room===sel))await db.doc('players/'+p.id).update({answers:{}});await setRoom({phase:'lobby',idx:0,startedAt:0})});
 on('#dr',async()=>{if(!confirm('Eliminare la stanza? I giocatori dovranno sceglierne un\'altra.'))return;
  for(const p of players.filter(p=>p.room===sel))await db.doc('players/'+p.id).update({room:null,answers:{}});await db.doc('rooms/'+sel).delete();sel=null});
 on('#all',async()=>{if(!confirm('Cancellare tutti i partecipanti registrati?'))return;
  for(const p of players){await db.doc('names/'+key(p.name)).delete().catch(()=>{});await db.doc('players/'+p.id).delete()}});
}
applyTheme();
render();
})();
</script></body></html>
